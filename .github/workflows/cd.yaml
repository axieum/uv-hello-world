# Prepares and releases the project

name: CD

on:
  push:
    branches: [ 'main' ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release

    runs-on: ubuntu-latest

    concurrency:
      group: git-reflow-${{ github.ref }}
      cancel-in-progress: false

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: ✨ Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🙌 Prepare release
        id: git-reflow
        uses: axieum/git-reflow@v1

      - name: 📝 Log release information
        env:
          PRS: ${{ steps.git-reflow.outputs.prs }}
          PR: ${{ steps.git-reflow.outputs.pr }}
          RELEASES: ${{ steps.git-reflow.outputs.releases }}
          RELEASE: ${{ steps.git-reflow.outputs.release }}
        run: |
          printf '%s\n' "PRs: $PRS"
          printf '%s\n' "PR: $PR"
          printf '%s\n' "Releases: $RELEASES"
          printf '%s\n' "Release: $RELEASE"

    outputs:
      prs: ${{ steps.git-reflow.outputs.prs }}
      pr: ${{ steps.git-reflow.outputs.pr }}
      releases: ${{ steps.git-reflow.outputs.releases }}
      release: ${{ steps.git-reflow.outputs.release }}
